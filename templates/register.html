<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h2>Student Registration</h2>

        <form action="/register" method="POST">

            <label for="adm_no">Admission Number</label>
            <input type="text" id="adm_no" name="adm_no" required>

            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="check_password">Confirm Password</label>
            <input type="password" id="check_password" name="check_password" required>

            <label for="supervisor_id">Supervisor</label>
            <select id="supervisor_id" name="supervisor_id" required>
                <option value="">-- Select Supervisor --</option>
                {% for supervisor in supervisors %}
                    <option value="{{ supervisor[0] }}">
                        {{ supervisor[1] }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit">Register</button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Login here</a>
        </p>

    </div>

</body>
</html>
