<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Logbook Entry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
</head>
<body>
    <div class="container">
        <h1>Edit Logbook Entry</h1>
        <form method='POST'>
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="entry_date" value="{{entry[1]}}" required>
            </div>
            <div class="form-group">
                <label>Activity</label>
                <textarea name="activity" rows="4" placeholder="Enter activity details..." required>{{entry[2]}}</textarea>
            </div>
            <div class="form-group">
                <label>Hours Worked</label>
                <input type="number" name="hours_worked" min="1" value="{{entry[3]}}" required>
            </div>
            <div class="buttons">
                <button type="submit">💾 Save Changes</button>
                <a href="/view_entries">
                    <button type="button">⬅ Back</button>
                </a>
                <a href="/dashboard">
                    <button type="button">🏠 Back to Dashboard</button>
                </a>
            </div>
        </form>
    </div>
</body>
</html>
